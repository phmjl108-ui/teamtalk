<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>팀톡</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="팀톡">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo",Pretendard,"Helvetica Neue",Arial,sans-serif;--bg:#fff;--panel:#fff;--bg-2:#F2F2F7;--side:#F2F2F7;--side-txt:#000;--txt:#000;--muted:rgba(60,60,67,.60);--muted-3:rgba(60,60,67,.30);--line:rgba(60,60,67,.29);--me:#007AFF;--me-txt:#fff;--other:#E9E9EB;--accent:#007AFF;--sys:rgba(120,120,128,.14);--sel:rgba(0,122,255,.12);--hover:rgba(60,60,67,.06);--bar:rgba(255,255,255,.72);}
:root:not([data-theme="light"]){@media(prefers-color-scheme:dark){:root{--bg:#000;--panel:#1C1C1E;--bg-2:#000;--side:#1C1C1E;--side-txt:#fff;--txt:#fff;--muted:rgba(235,235,245,.60);--muted-3:rgba(235,235,245,.30);--line:rgba(84,84,88,.60);--me:#0A84FF;--me-txt:#fff;--other:#262628;--accent:#0A84FF;--sys:rgba(120,120,128,.24);--sel:rgba(10,132,255,.22);--hover:rgba(235,235,245,.08);--bar:rgba(28,28,30,.72);}}}
:root[data-theme="dark"]{--bg:#000;--panel:#1C1C1E;--bg-2:#000;--side:#1C1C1E;--side-txt:#fff;--txt:#fff;--muted:rgba(235,235,245,.60);--muted-3:rgba(235,235,245,.30);--line:rgba(84,84,88,.60);--me:#0A84FF;--me-txt:#fff;--other:#262628;--accent:#0A84FF;--sys:rgba(120,120,128,.24);--sel:rgba(10,132,255,.22);--hover:rgba(235,235,245,.08);--bar:rgba(28,28,30,.72);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:17px;-webkit-font-smoothing:antialiased;height:100vh;height:100dvh;display:flex;overflow:hidden}
button{font-family:inherit}
.side{width:260px;background:var(--side);color:var(--side-txt);display:flex;flex-direction:column;flex-shrink:0;z-index:20;border-right:.5px solid var(--line)}
.brand{padding:16px;font-weight:700;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;border-bottom:.5px solid var(--line)}
.dot{width:14px;height:14px;border-radius:5px;background:var(--accent)}
.chlist{flex:1;overflow:auto;padding:8px 8px}
.chlab{font-size:13px;color:var(--muted);padding:10px 10px 4px}
.ch{padding:10px 10px;border-radius:10px;cursor:pointer;font-size:16px;display:flex;align-items:center;gap:6px;color:var(--txt)}
.ch:hover{background:var(--hover)}.ch.on{background:var(--sel);font-weight:600}
.ch.on .nm{color:var(--accent)}
.ch .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .act{opacity:0;font-size:14px;padding:2px 4px;border-radius:6px}
.ch .act:hover{background:var(--hover)}
.badge{background:var(--accent);color:#fff;font-size:12px;font-weight:600;line-height:1;min-width:20px;height:20px;padding:0 6px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;text-align:center;margin-left:8px;flex-shrink:0;font-variant-numeric:tabular-nums}
.ch:hover .act,.ch.on .act{opacity:.7}
.addch{margin:6px 10px;padding:10px;border-radius:10px;cursor:pointer;font-size:15px;color:var(--accent);text-align:center}
.addch:hover{background:var(--hover)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{padding:11px 14px;border-top:env(safe-area-inset-top) solid transparent;border-bottom:.5px solid var(--line);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);display:flex;align-items:center;gap:8px;position:relative;z-index:10}
.ham{display:none;background:none;border:0;font-size:22px;color:var(--accent);cursor:pointer;padding:0 2px;line-height:1}
.top .titwrap{flex:1;min-width:0;text-align:center}
.top h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{color:var(--muted);display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{background:none;border:0;color:var(--accent);border-radius:8px;padding:7px 8px;cursor:pointer;font-size:15px;white-space:nowrap}
.iconbtn:active{opacity:.5}
.iconbtn.me{font-weight:500;max-width:120px;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:6px}
.mini{width:24px;height:24px;border-radius:50%;background:var(--accent);background-size:cover;background-position:center;flex-shrink:0}
.feed{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.msg{display:flex;gap:7px;max-width:78%;align-items:flex-end;margin-top:9px}.msg.me{align-self:flex-end;flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;background-size:cover;background-position:center;overflow:hidden}
.bub{background:var(--other);color:var(--txt);border:0;border-radius:18px;padding:8px 13px;font-size:16px;line-height:1.32;word-break:break-word}
.msg.me .bub{background:var(--me);color:var(--me-txt)}
.photo{max-width:230px;max-height:280px;border-radius:16px;display:block;margin-bottom:4px;cursor:pointer}
.filechip{display:inline-flex;align-items:center;gap:6px;background:var(--other);border:0;border-radius:14px;padding:9px 12px;font-size:14px;color:var(--txt);text-decoration:none;margin-bottom:4px;max-width:230px;word-break:break-all}
.msg.me .filechip{background:var(--me);color:#fff}
.meta{font-size:11px;color:var(--muted-3);margin:0 6px 2px}.msg.me .meta{text-align:right}
.delbtn{opacity:0;background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 4px;align-self:center}
.msg:hover .delbtn{opacity:.55}
.sysmsg{align-self:center;background:transparent;color:var(--muted);font-size:12px;font-weight:500;padding:8px 12px;max-width:85%;text-align:center}
.typing{display:none;align-items:center;gap:7px;padding:4px 16px 2px;font-size:12px;color:var(--muted)}
.typing.show{display:flex}
.tdots{display:inline-flex;gap:3px;align-items:flex-end;height:11px}
.tdots i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block;animation:tbounce 1.2s infinite ease-in-out}
.tdots i:nth-child(2){animation-delay:.18s}
.tdots i:nth-child(3){animation-delay:.36s}
@keyframes tbounce{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}
.attachstrip{display:none;gap:8px;padding:8px 12px 0;overflow-x:auto}
.attachstrip.show{display:flex}
.pchip{position:relative;flex-shrink:0;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:6px 8px;display:flex;align-items:center;gap:6px;font-size:12px;max-width:150px}
.pchip img{width:40px;height:40px;object-fit:cover;border-radius:6px;display:block}
.pchip .x{position:absolute;top:-7px;right:-7px;background:#ff3b30;color:#fff;border-radius:50%;width:18px;height:18px;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.composer{border-top:.5px solid var(--line);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end}
.composer .attach{background:transparent;border:0;color:var(--accent);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:30px;font-weight:300;flex-shrink:0;line-height:1;padding:0}
.composer input[type=text]{flex:1;padding:8px 14px;min-height:36px;border:.5px solid var(--line);border-radius:18px;background:var(--bg);color:var(--txt);font-size:17px}
.composer input[type=text]:focus{outline:none;border-color:var(--accent)}
.composer .send{width:36px;height:36px;border:0;border-radius:50%;background:var(--accent);color:#fff;cursor:pointer;font-size:0;flex-shrink:0;padding:0;display:flex;align-items:center;justify-content:center}
.composer .send::after{content:"↑";font-size:19px;font-weight:700;line-height:1}
.composer .send:disabled{background:var(--muted-3)}
.empty{color:var(--muted);text-align:center;margin:auto;font-size:15px;line-height:1.6}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}
.ov.show{display:flex}
.card{background:var(--panel);border-radius:18px;padding:22px;max-width:360px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.14);text-align:center}
.card h3{margin:0 0 6px}.card p{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 14px}
.card input[type=text],.card input[type=password]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--txt);font-size:16px;margin-bottom:10px}
.card button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;font-size:15px}
.card .ghost{background:transparent;color:var(--muted);border:1px solid var(--line);margin-top:8px}
.err{color:#d6455b;font-size:12px;margin-bottom:10px;min-height:1px}
#qrbox{display:flex;justify-content:center;margin:6px 0 12px}#qrbox canvas{border-radius:10px}
.linkrow{display:flex;gap:6px;margin-bottom:6px}.linkrow input{margin:0;font-size:12px}
.pavwrap{display:flex;justify-content:center;margin-bottom:12px}
.pav{width:88px;height:88px;border-radius:50%;background:var(--accent);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;font-weight:600;cursor:pointer;position:relative}
.pav::after{content:"📷";position:absolute;right:-2px;bottom:-2px;font-size:16px;background:var(--panel);border-radius:50%;padding:3px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15;display:none}.scrim.show{display:block}
.toasts{position:fixed;bottom:84px;right:12px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:320px;width:calc(100% - 24px);pointer-events:none}
.toast{pointer-events:auto;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border:.5px solid var(--line);border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.16);padding:11px 30px 11px 14px;cursor:pointer;position:relative;animation:tin .22s ease}
.toast .tt{font-weight:600;font-size:14px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast .tb{font-size:13px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.toast .tx{position:absolute;top:6px;right:9px;color:var(--muted);font-size:15px;line-height:1}
@keyframes tin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#notifBtn{color:#d6a000;border-color:#d6a000}
@media(max-width:720px){
  .side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .22s;box-shadow:4px 0 20px rgba(0,0,0,.3)}
  .side.open{transform:translateX(0)} .ham{display:block} .msg{max-width:86%}
  #notifBtn{font-size:0;padding:7px 9px} #notifBtn::before{content:"🔔";font-size:15px}
}
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<nav class="side" id="side">
  <div class="brand"><span class="dot"></span><span>팀톡</span></div>
  <div class="chlist" id="chlist"></div>
  <div class="addch" id="addch">+ 채널 추가</div>
</nav>
<main class="main">
  <div class="top">
    <button class="ham" id="ham" aria-label="채널">☰</button>
    <div class="titwrap"><h2 id="chName" title="채널 설정"># 일반</h2><small id="chSub"></small></div>
    <button class="iconbtn" id="notifBtn" style="display:none">🔔 알림 켜기</button>
    <button class="iconbtn" id="shareBtn">🔗 공유</button>
    <button class="iconbtn me" id="nameBtn"><span class="mini" id="miniAv"></span><span id="myName">나</span></button>
    <button class="iconbtn" id="themeBtn">🌓</button>
  </div>
  <div class="feed" id="feed"></div>
  <div class="typing" id="typing"></div>
  <div class="attachstrip" id="attachStrip"></div>
  <form class="composer" id="composer">
    <button type="button" class="attach" id="attachBtn" title="이미지·파일 첨부">＋</button>
    <input type="text" id="input" placeholder="메시지 입력… (이미지 붙여넣기 가능)" autocomplete="off" disabled>
    <button type="submit" class="send" disabled>보내기</button>
  </form>
</main>
<div class="toasts" id="toasts"></div>
<input type="file" id="attachFile" multiple style="display:none">
<input type="file" id="profileFile" accept="image/*" style="display:none">

<div class="ov show" id="setup"><div class="card">
  <h3>팀톡 입장</h3>
  <p>대화명을 입력하고 입장하세요. 같은 앱을 연 사람끼리 실시간으로 대화됩니다.</p>
  <input type="text" id="nick" placeholder="대화명 (예: 홍길동)">
  <div class="err" id="cfgErr"></div>
  <button id="connect">입장하기</button>
</div></div>

<div class="ov" id="shareOv"><div class="card">
  <h3>초대 링크</h3><p>이 QR을 찍거나 링크를 보내면 누구나 들어올 수 있어요.</p>
  <div id="qrbox"></div>
  <div class="linkrow"><input type="text" id="shareUrl" readonly></div>
  <button id="copyBtn">링크 복사</button>
  <button class="ghost" id="shareClose">닫기</button>
</div></div>

<div class="ov" id="profileOv"><div class="card">
  <h3>내 프로필</h3>
  <div class="pavwrap"><div class="pav" id="pavPreview"></div></div>
  <input type="text" id="pName" placeholder="대화명">
  <div class="err" id="pErr"></div>
  <button id="pSave">저장</button>
  <button class="ghost" id="pClose">닫기</button>
</div></div>

<div class="ov" id="chanOv"><div class="card">
  <h3 id="chanTitle">새 채널</h3>
  <input type="text" id="chanName" placeholder="채널 이름">
  <input type="password" id="chanPwInput" placeholder="비밀번호 (비우면 공개)">
  <p id="chanHint">🔒 비밀번호를 넣으면 입장·삭제할 때 비번이 필요합니다.</p>
  <div class="err" id="chanErr"></div>
  <button id="chanSave">만들기</button>
  <button class="ghost" id="chanRemovePw" style="display:none">🔓 공개로 전환 (비밀번호 없애기)</button>
  <button class="ghost" id="chanClose">닫기</button>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script>
const LS="teamtalk_fb";
const FB={databaseURL:"https://ymx-ae932-default-rtdb.firebaseio.com"};
const el=id=>document.getElementById(id);
const init=s=>(s||"?").trim()[0]||"?";
function hash(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);}
function fmtSize(b){return b<1024?b+"B":b<1048576?Math.round(b/1024)+"KB":(b/1048576).toFixed(1)+"MB";}

let db, me, myImg=null, cur="일반", chans={"일반":1}, profiles={}, unsub=null, typingRef=null, typingTimer=null, lastType=0, pend=[], prevMeta=null, chanEdit=null;
let clientId;
try{clientId=localStorage.getItem(LS+"_cid")||(crypto.randomUUID?crypto.randomUUID():"c"+Math.random().toString(36).slice(2));localStorage.setItem(LS+"_cid",clientId);}catch(e){clientId="c"+Math.random().toString(36).slice(2);}
let unlocked=new Set();try{unlocked=new Set(JSON.parse(localStorage.getItem(LS+"_unlocked")||"[]"))}catch(e){}
function saveUnlocked(){try{localStorage.setItem(LS+"_unlocked",JSON.stringify([...unlocked]))}catch(e){}}
function chanPw(name){const v=chans[name];return (v&&typeof v==="object"&&v.pw)?v.pw:null;}
let lastCur=null, unreadN={}, seenKey={}, lastKeyOf={}, watchers={};
try{unreadN=JSON.parse(localStorage.getItem(LS+"_unread")||"{}")}catch(e){}
try{seenKey=JSON.parse(localStorage.getItem(LS+"_seenkey")||"{}")}catch(e){}
try{lastCur=localStorage.getItem(LS+"_cur")}catch(e){}
function saveUnread(){try{localStorage.setItem(LS+"_unread",JSON.stringify(unreadN));localStorage.setItem(LS+"_seenkey",JSON.stringify(seenKey));}catch(e){}}
function unreadOf(name){return unreadN[name]||0;}
function bumpSeq(ch){try{db.ref("meta/"+ch+"/seq").transaction(n=>(n||0)+1);}catch(e){}}
function isMineMsg(m){return !!(m&&(m.cid?m.cid===clientId:m.u===me));}
function attHas(m){return !!(m&&(m.img||(m.atts&&(Array.isArray(m.atts)?m.atts.length:Object.keys(m.atts).length))));}
function msgPreview(m){return (m&&m.t)||(m&&m.img?"사진":(attHas(m)?"첨부":""));}
function markSeen(name){unreadN[name]=0;if(lastKeyOf[name])seenKey[name]=lastKeyOf[name];saveUnread();}
// 받는 쪽이 각 채널 메시지를 직접 감시 → 보낸 사람 버전과 무관하게 배지·알림이 뜸
function watchAll(){
  if(!db)return;
  const names=Object.keys(chans);
  Object.keys(watchers).forEach(n=>{if(!names.includes(n)){watchers[n].ref.off();delete watchers[n];}});
  names.forEach(n=>{
    if(watchers[n])return;
    const ref=db.ref("msg/"+n).limitToLast(1);const w={ref:ref,primed:false};watchers[n]=w;
    ref.on("value",s=>{
      let key=null,msg=null;s.forEach(c=>{key=c.key;msg=c.val();});
      if(!w.primed){w.primed=true;lastKeyOf[n]=key;if(seenKey[n]===undefined)seenKey[n]=key;else if(key&&key!==seenKey[n]&&n!==cur&&!unreadN[n])unreadN[n]=1;renderCh();return;}
      if(key&&(!lastKeyOf[n]||key>lastKeyOf[n])){
        lastKeyOf[n]=key;const viewing=(n===cur&&!document.hidden);
        if(viewing){seenKey[n]=key;unreadN[n]=0;}
        else if(!isMineMsg(msg)){unreadN[n]=(unreadN[n]||0)+1;notify("# "+n+" · "+((msg&&msg.u)||""),msgPreview(msg),n);}
        saveUnread();renderCh();
      }
    });
  });
}

function shrink(file,maxW,q){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);res(c.toDataURL("image/jpeg",q));};im.onerror=rej;im.src=fr.result;};fr.onerror=rej;fr.readAsDataURL(file);});}
function readData(f){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(f);});}

function boot(nick){
  if(!firebase.apps.length)firebase.initializeApp(FB);
  db=firebase.database();
  me=nick; el("myName").textContent=me;
  el("input").disabled=false; el("composer").querySelector(".send").disabled=false;
  db.ref("profiles").on("value",s=>{profiles=s.val()||{};refreshMyAv();if(cur)renderFeed();});
  db.ref("profiles/"+clientId).update({name:me,img:myImg||null});
  let opened=false;
  db.ref("channels").on("value",s=>{chans=s.val()||{};if(!Object.keys(chans).length)chans={"일반":1};watchAll();if(!opened){opened=true;const st=(lastCur&&chans[lastCur])?lastCur:Object.keys(chans)[0];openCh(st);}else if(!chans[cur]){openCh(Object.keys(chans)[0]);}renderCh();});
}
function refreshMyAv(){const p=profiles[clientId];const a=el("miniAv");if(p&&p.img){a.style.backgroundImage="url("+p.img+")";}else a.style.backgroundImage="";}
function closeDrawer(){el("side").classList.remove("open");el("scrim").classList.remove("show");}

function renderCh(){
  const w=el("chlist");w.innerHTML='<div class="chlab">채널</div>';
  Object.keys(chans).forEach(name=>{
    const locked=!!chanPw(name);
    const d=document.createElement("div");d.className="ch"+(name===cur?" on":"");
    const nm=document.createElement("span");nm.className="nm";nm.textContent=(locked?"🔒 ":"# ")+name;
    const ed=document.createElement("span");ed.className="act";ed.textContent="⚙";ed.title="채널 설정";
    ed.onclick=e=>{e.stopPropagation();openChanModal(name);};
    const del=document.createElement("span");del.className="act";del.textContent="🗑";del.title="채널 삭제";
    del.onclick=e=>{e.stopPropagation();deleteChannel(name);};
    d.appendChild(nm);
    d.appendChild(ed);d.appendChild(del);
    const u=unreadOf(name);if(u>0&&name!==cur){const bg=document.createElement("span");bg.className="badge";bg.textContent=u>99?"99+":u;d.appendChild(bg);}
    d.onclick=()=>{openCh(name);closeDrawer();};
    w.appendChild(d);
  });
}

let currentArr=[];
function openCh(name){
  const pw=chanPw(name);
  if(pw && !unlocked.has(name)){const inp=prompt('🔒 "'+name+'" 채널 비밀번호');if(inp===null)return;if(hash(inp)!==pw){alert("비밀번호가 틀렸습니다.");return;}unlocked.add(name);saveUnlocked();}
  if(cur&&db&&cur!==name)db.ref("typing/"+cur+"/"+clientId).remove();
  cur=name;try{localStorage.setItem(LS+"_cur",name)}catch(e){}el("chName").textContent="# "+name;markSeen(name);renderCh();
  el("feed").innerHTML='<div class="empty">메시지를 불러오는 중…</div>';
  if(unsub)unsub.off();
  const ref=db.ref("msg/"+name).limitToLast(300);unsub=ref;
  ref.on("value",s=>{currentArr=[];s.forEach(c=>{currentArr.push(Object.assign({__key:c.key},c.val()));});if(!document.hidden)markSeen(name);renderFeed();});
  listenTyping(name);
}
function attArray(m){return Array.isArray(m.atts)?m.atts:(m.atts?Object.values(m.atts):[]);}
function renderFeed(){
  const feed=el("feed");const arr=currentArr;
  const talk=arr.filter(m=>!m.sys);
  el("chSub").textContent=talk.length?talk.length+"개 메시지":"첫 메시지를 남겨보세요";
  feed.innerHTML="";
  if(!arr.length){feed.innerHTML='<div class="empty">아직 메시지가 없어요.</div>';return;}
  arr.forEach(m=>{
    if(m.sys){const s=document.createElement("div");s.className="sysmsg";s.textContent=m.t;feed.appendChild(s);return;}
    const mine=m.cid?m.cid===clientId:(m.u===me);
    const row=document.createElement("div");row.className="msg"+(mine?" me":"");
    const av=document.createElement("div");av.className="av";
    let p=profiles[m.cid];
    if(!(p&&p.img)){const byName=Object.values(profiles).find(x=>x&&x.name===m.u&&x.img);if(byName)p=byName;}
    if(p&&p.img){av.style.backgroundImage="url("+p.img+")";}else av.textContent=init(m.u);
    const col=document.createElement("div");
    const meta=document.createElement("div");meta.className="meta";meta.textContent=m.u;col.appendChild(meta);
    if(m.img){const im=document.createElement("img");im.className="photo";im.src=m.img;im.onclick=()=>window.open(m.img,"_blank");col.appendChild(im);}
    attArray(m).forEach(a=>{
      if(a.kind==="image"){const im=document.createElement("img");im.className="photo";im.src=a.data;im.onclick=()=>window.open(a.data,"_blank");col.appendChild(im);}
      else{const lk=document.createElement("a");lk.className="filechip";lk.href=a.data;lk.download=a.name||"file";lk.textContent="📎 "+(a.name||"파일")+(a.size?" ("+fmtSize(a.size)+")":"");col.appendChild(lk);}
    });
    if(m.t){const b=document.createElement("div");b.className="bub";b.textContent=m.t;col.appendChild(b);}
    row.appendChild(av);row.appendChild(col);
    if(mine){const db2=document.createElement("button");db2.className="delbtn";db2.textContent="🗑";db2.title="삭제";db2.onclick=()=>deleteMsg(m.__key);row.appendChild(db2);}
    feed.appendChild(row);
  });
  feed.scrollTop=feed.scrollHeight;
}
function deleteMsg(key){if(!key||!db)return;if(!confirm("이 메시지를 삭제할까요?"))return;db.ref("msg/"+cur+"/"+key).remove();}

// 전송 (텍스트 + 첨부)
el("composer").onsubmit=e=>{e.preventDefault();const v=el("input").value.trim();if((!v&&!pend.length)||!db)return;const msg={u:me,cid:clientId,t:v,ts:Date.now()};if(pend.length)msg.atts=pend.map(a=>a.kind==="image"?{kind:"image",data:a.data}:{kind:"file",data:a.data,name:a.name,size:a.size});db.ref("msg/"+cur).push(msg);const prev=v||(pend.some(a=>a.kind==="image")?"사진":"파일");bumpSeq(cur);db.ref("meta/"+cur+"/last").set({u:me,t:prev.slice(0,40),ts:Date.now()});pend=[];renderPend();el("input").value="";stopTyping();};

// 첨부(이미지+파일) / 클립보드 붙여넣기 / 미리보기
el("attachBtn").onclick=()=>el("attachFile").click();
el("attachFile").onchange=e=>{addFiles(e.target.files);e.target.value="";};
el("input").addEventListener("paste",e=>{const items=e.clipboardData&&e.clipboardData.items;if(!items)return;const fs=[];for(const it of items){if(it.kind==="file"){const f=it.getAsFile();if(f)fs.push(f);}}if(fs.length){e.preventDefault();addFiles(fs);}});
async function addFiles(files){
  for(const f of files){
    if(pend.length>=6){alert("한 번에 최대 6개까지 첨부할 수 있어요.");break;}
    if(f.type&&f.type.indexOf("image/")===0){try{pend.push({kind:"image",data:await shrink(f,1000,0.6),name:f.name||"image.jpg"});}catch(err){}}
    else{if(f.size>1048576){alert('"'+(f.name||"파일")+'"은 1MB를 넘어 첨부할 수 없어요.');continue;}pend.push({kind:"file",data:await readData(f),name:f.name||"file",size:f.size});}
  }
  renderPend();
}
function renderPend(){const s=el("attachStrip");s.innerHTML="";if(!pend.length){s.classList.remove("show");return;}s.classList.add("show");pend.forEach((a,i)=>{const chip=document.createElement("div");chip.className="pchip";if(a.kind==="image"){const im=document.createElement("img");im.src=a.data;chip.appendChild(im);}else{const sp=document.createElement("span");sp.textContent="📎 "+a.name;chip.appendChild(sp);}const x=document.createElement("span");x.className="x";x.textContent="×";x.onclick=()=>{pend.splice(i,1);renderPend();};chip.appendChild(x);s.appendChild(chip);});}

// 입력 중 표시
el("input").addEventListener("input",()=>{if(!db||!me)return;const now=Date.now();if(now-lastType>900){lastType=now;const r=db.ref("typing/"+cur+"/"+clientId);r.set({name:me,ts:now});r.onDisconnect().remove();}clearTimeout(typingTimer);typingTimer=setTimeout(stopTyping,2500);});
function stopTyping(){clearTimeout(typingTimer);if(db&&cur)db.ref("typing/"+cur+"/"+clientId).remove();}
function listenTyping(name){if(typingRef)typingRef.off();typingRef=db.ref("typing/"+name);typingRef.on("value",s=>{const now=Date.now();const names=[];s.forEach(c=>{const v=c.val();if(c.key!==clientId&&v&&v.ts>now-5000)names.push(v.name);});const box=el("typing");if(!names.length){box.classList.remove("show");box.textContent="";return;}box.classList.add("show");box.innerHTML='<span class="tdots"><i></i><i></i><i></i></span>';const who=(names.length<=2?names.join(", "):names.length+"명");const t=document.createElement("span");t.textContent=who+"님이 입력 중";box.appendChild(t);});}

// 알림
function toast(title,body,ch){const w=el("toasts");if(!w)return;const d=document.createElement("div");d.className="toast";d.innerHTML='<span class="tx">×</span><div class="tt"></div><div class="tb"></div>';d.querySelector(".tt").textContent=title;d.querySelector(".tb").textContent=body||"";d.querySelector(".tx").onclick=e=>{e.stopPropagation();d.remove();};d.onclick=()=>{if(ch)openCh(ch);d.remove();};w.appendChild(d);while(w.children.length>4)w.firstChild.remove();setTimeout(()=>{d.style.transition="opacity .3s";d.style.opacity="0";setTimeout(()=>d.remove(),300);},6000);}
async function notify(title,body,ch){toast(title,body,ch);if(!("Notification"in window)||Notification.permission!=="granted")return;const opts={body:body||"",tag:"tt-"+ch,icon:"icon-192.png",badge:"icon-192.png",renotify:true,data:{ch}};try{if(navigator.serviceWorker){const reg=await navigator.serviceWorker.ready;if(reg&&reg.showNotification){await reg.showNotification(title,opts);return;}}}catch(e){}try{const n=new Notification(title,opts);n.onclick=()=>{window.focus();if(ch)openCh(ch);n.close();};}catch(e){}}
function updNotifBtn(){const b=el("notifBtn");if(!b)return;if(!("Notification"in window)){b.style.display="none";return;}const p=Notification.permission;if(p==="granted"){b.style.display="none";}else if(p==="denied"){b.style.display="";b.textContent="🔕 알림 차단됨";b.title="주소창 자물쇠 → 알림 → 허용 으로 바꾼 뒤 새로고침하세요";}else{b.style.display="";b.textContent="🔔 알림 켜기";b.title="클릭하면 윈도우 알림을 켭니다";}}
window.addEventListener("focus",()=>{if(cur&&db){markSeen(cur);renderCh();}});

// 프로필
el("nameBtn").onclick=()=>{el("pName").value=me;const pv=el("pavPreview");if(myImg){pv.style.backgroundImage="url("+myImg+")";pv.textContent="";}else{pv.style.backgroundImage="";pv.textContent=init(me);}el("pErr").textContent="";el("profileOv").classList.add("show");};
el("pavPreview").onclick=()=>el("profileFile").click();
el("profileFile").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{myImg=await shrink(f,160,0.7);const pv=el("pavPreview");pv.style.backgroundImage="url("+myImg+")";pv.textContent="";}catch(err){el("pErr").textContent="사진을 불러오지 못했습니다.";}};
el("pSave").onclick=()=>{const nn=el("pName").value.trim();if(!nn){el("pErr").textContent="대화명을 입력하세요.";return;}const old=me;me=nn;el("myName").textContent=me;try{localStorage.setItem(LS,JSON.stringify({nick:me,img:myImg}))}catch(e){}db.ref("profiles/"+clientId).update({name:me,img:myImg||null});if(old!==nn)db.ref("msg/"+cur).push({sys:true,t:old+"님이 이름을 "+nn+"(으)로 변경했습니다",ts:Date.now()});el("profileOv").classList.remove("show");};
el("pClose").onclick=()=>el("profileOv").classList.remove("show");

// 채널 설정 모달 (만들기 / 이름변경 / 비밀번호)
function openChanModal(name){
  if(name){const pw=chanPw(name);if(pw&&!unlocked.has(name)){const inp=prompt('🔒 "'+name+'" 설정하려면 비밀번호 입력');if(inp===null)return;if(hash(inp)!==pw){alert("비밀번호가 틀렸습니다.");return;}unlocked.add(name);saveUnlocked();}}
  chanEdit=name||null;
  const locked=name?!!chanPw(name):false;
  el("chanTitle").textContent=name?"채널 설정":"새 채널";
  el("chanName").value=name||"";
  el("chanPwInput").value="";
  el("chanPwInput").placeholder=locked?"새 비밀번호 (비우면 유지)":"비밀번호 (비우면 공개)";
  el("chanSave").textContent=name?"저장":"만들기";
  el("chanRemovePw").style.display=locked?"block":"none";
  el("chanErr").textContent="";
  el("chanOv").classList.add("show");
}
el("addch").onclick=()=>openChanModal(null);
el("chName").onclick=()=>openChanModal(cur);
el("chanClose").onclick=()=>el("chanOv").classList.remove("show");
el("chanSave").onclick=async()=>{
  const nm=el("chanName").value.trim();const pw=el("chanPwInput").value.trim();
  if(!nm){el("chanErr").textContent="채널 이름을 입력하세요.";return;}
  if(!chanEdit){
    if(chans[nm]){el("chanErr").textContent="이미 있는 채널이에요.";return;}
    db.ref("channels/"+nm).set(pw?{pw:hash(pw)}:1);if(pw){unlocked.add(nm);saveUnlocked();}
    el("chanOv").classList.remove("show");openCh(nm);closeDrawer();return;
  }
  const old=chanEdit;
  if(nm!==old&&chans[nm]){el("chanErr").textContent="그 이름의 채널이 이미 있어요.";return;}
  const val=pw?{pw:hash(pw)}:(chanPw(old)?{pw:chanPw(old)}:1);
  if(nm!==old){
    const snap=await db.ref("msg/"+old).once("value");const mt=(await db.ref("meta/"+old).once("value")).val();
    const up={};up["channels/"+nm]=val;up["channels/"+old]=null;up["msg/"+nm]=snap.val()||null;up["msg/"+old]=null;up["meta/"+nm]=mt||null;up["meta/"+old]=null;
    await db.ref().update(up);
    if(unlocked.has(old)){unlocked.delete(old);}if(val&&val.pw){unlocked.add(nm);}saveUnlocked();
    unreadN[nm]=unreadN[old]||0;delete unreadN[old];if(seenKey[old]!==undefined){seenKey[nm]=seenKey[old];delete seenKey[old];}if(watchers[old]){watchers[old].ref.off();delete watchers[old];}saveUnread();
    db.ref("msg/"+nm).push({sys:true,t:'채널 이름이 "'+old+'"에서 "'+nm+'"(으)로 변경되었습니다',ts:Date.now()});
    el("chanOv").classList.remove("show");openCh(nm);
  }else{
    db.ref("channels/"+nm).set(val);if(pw){unlocked.add(nm);saveUnlocked();}
    el("chanOv").classList.remove("show");
  }
};
el("chanRemovePw").onclick=()=>{if(!chanEdit)return;if(!confirm("이 채널을 공개로 바꿀까요? (비밀번호 없음)"))return;db.ref("channels/"+chanEdit).set(1);el("chanOv").classList.remove("show");};

async function deleteChannel(name){
  if(Object.keys(chans).length<=1){alert("마지막 채널은 삭제할 수 없어요.");return;}
  const pw=chanPw(name);
  if(pw){if(!unlocked.has(name)){const inp=prompt('🔒 "'+name+'" 삭제하려면 비밀번호 입력');if(inp===null)return;if(hash(inp)!==pw){alert("비밀번호가 틀렸습니다.");return;}}else{if(!confirm('"'+name+'" 채널을 삭제할까요?'))return;}}
  else{if(!confirm('"'+name+'" 채널을 삭제할까요? 메시지도 모두 사라집니다.'))return;}
  const up={};up["channels/"+name]=null;up["msg/"+name]=null;up["typing/"+name]=null;up["meta/"+name]=null;
  await db.ref().update(up);unlocked.delete(name);saveUnlocked();delete unreadN[name];delete seenKey[name];if(watchers[name]){watchers[name].ref.off();delete watchers[name];}saveUnread();
  if(cur===name)openCh(Object.keys(chans).filter(c=>c!==name)[0]||"일반");
}

// 모바일 드로어 / 공유 / 테마 / 입장
el("ham").onclick=()=>{el("side").classList.toggle("open");el("scrim").classList.toggle("show");};
el("scrim").onclick=closeDrawer;
function shareLink(){return location.origin+location.pathname;}
el("shareBtn").onclick=()=>{const url=shareLink();el("qrbox").innerHTML="";try{const c=document.createElement("canvas");el("qrbox").appendChild(c);new QRious({element:c,value:url,size:200,level:"M"});}catch(e){el("qrbox").textContent="QR 생성 실패";}el("shareUrl").value=url;el("shareOv").classList.add("show");};
el("shareClose").onclick=()=>el("shareOv").classList.remove("show");
el("copyBtn").onclick=async()=>{try{await navigator.clipboard.writeText(shareLink());el("copyBtn").textContent="복사됨 ✓";setTimeout(()=>el("copyBtn").textContent="링크 복사",1500);}catch(e){el("shareUrl").select();document.execCommand("copy");}};
el("connect").onclick=()=>{el("cfgErr").textContent="";const nick=el("nick").value.trim();if(!nick){el("cfgErr").textContent="대화명을 입력하세요.";return;}try{boot(nick);localStorage.setItem(LS,JSON.stringify({nick,img:myImg}));el("setup").classList.remove("show");if("Notification"in window&&Notification.permission==="default")Notification.requestPermission().then(updNotifBtn);else updNotifBtn();}catch(e){el("cfgErr").textContent="연결 실패: "+e.message;}};
el("nick").addEventListener("keydown",e=>{if(e.key==="Enter")el("connect").click();});
el("themeBtn").onclick=()=>{const c=document.documentElement.getAttribute("data-theme");const n=c==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",n);try{localStorage.setItem(LS+"_t",n)}catch(e){}};
el("notifBtn").onclick=()=>{if(!("Notification"in window)){alert("이 브라우저는 알림을 지원하지 않습니다.");return;}if(Notification.permission==="denied"){alert("알림이 차단돼 있어요.\n주소창 왼쪽 자물쇠(또는 ⓘ) → 알림 → 허용 으로 바꾼 뒤 새로고침하세요.");return;}Notification.requestPermission().then(()=>{updNotifBtn();if(Notification.permission==="granted")notify("팀톡","알림이 켜졌어요 🎉",cur);});};
updNotifBtn();
try{const t=localStorage.getItem(LS+"_t");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}
try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.nick){myImg=s.img||null;boot(s.nick);el("setup").classList.remove("show");if("Notification"in window&&Notification.permission==="default")Notification.requestPermission().then(updNotifBtn);else updNotifBtn();}}catch(e){}
// 모바일: 키보드가 올라오면 앱 높이를 줄여 입력창이 키보드 위에 보이게
if(window.visualViewport){
  const vv=window.visualViewport;
  const fit=()=>{document.body.style.height=vv.height+"px";};
  vv.addEventListener("resize",fit);vv.addEventListener("scroll",fit);fit();
}
el("input").addEventListener("focus",()=>{setTimeout(()=>{const f=el("feed");if(f)f.scrollTop=f.scrollHeight;el("input").scrollIntoView({block:"nearest"});},300);});
// 서비스워커: 새 버전 자동 감지 → 자동 새로고침(구버전 고착 방지)
if("serviceWorker"in navigator){
  let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloaded)return;reloaded=true;location.reload();});
  navigator.serviceWorker.register("sw.js").then(reg=>{
    reg.update();
    setInterval(()=>reg.update(),60000);
  }).catch(()=>{});
}
</script>
